# Configuration of Hugo
# Hugo Documentation: https://gohugo.io/getting-started/configuration/

title: 'HTMLTrust'
baseURL: 'https://www.htmltrust.org/' # Website URL

############################
## PAGE OPTIONS
############################

cascade:
  # Blog post options
  - target:
      path: /blog/**
      kind: page
    show_date: true

############################
## LANGUAGE
############################

defaultContentLanguage: en
hasCJKLanguage: false
defaultContentLanguageInSubdir: false
removePathAccents: true

############################
## MARKUP
## These were previously inherited from the Hugo Blox modules. They are set
## explicitly now that the site has no theme.
############################

markup:
  goldmark:
    renderer:
      # Content pages embed raw HTML (the canonicalization demo on
      # /implementation/ ships a <script> tag). Goldmark drops raw HTML unless
      # this is on.
      unsafe: true
    parser:
      wrapStandAloneImageWithinParagraph: false
      attribute:
        block: true
        title: true
    extensions:
      typographer:
        # Leave quotes and dashes as authored. This site is about canonical
        # text: silently rewriting an apostrophe into a curly quote changes
        # what gets hashed, and the examples on /spec/ discuss those exact
        # characters.
        disable: true
      footnote: true
      table: true
  tableOfContents:
    startLevel: 2
    endLevel: 3
    ordered: false
  highlight:
    # Chroma highlights at build time, so no syntax-highlighting JavaScript
    # ships to the reader. `bw` is weight and slant only, no colour, which is
    # how code is set in print. noClasses keeps it self-contained: no separate
    # chroma stylesheet to keep in sync.
    noClasses: true
    style: bw
    lineNos: false
    tabWidth: 2
    wrapperClass: highlight

############################
## OUTPUTS
############################

outputs:
  home: [HTML, RSS]
  page: [HTML]
  section: [HTML, RSS]

############################
## ADVANCED
############################

enableGitInfo: false
summaryLength: 30
pagination:
  pagerSize: 20
enableEmoji: true
enableRobotsTXT: true
enableInlineShortcodes: true
disableAliases: true
ignoreFiles: [".ipynb_checkpoints$", "\\.Rmd$", "\\.Rmarkdown$", "_cache$"]

imaging:
  resampleFilter: lanczos
  quality: 90
  anchor: smart

taxonomies:
  tag: tags
