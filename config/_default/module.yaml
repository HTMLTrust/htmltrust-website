#
# The site has no theme. Layouts, partials and CSS are in this repository, and
# the only module is the project's own Hugo integration, which supplies the
# signing partial and the htmltrust-sign command used by CI.
#
# Hugo Blox was removed in favour of hand-written templates: the design goal is
# a plain, typographic, script-free page, which is easier to reach without a
# Tailwind design system to override. Removing it also dropped Tailwind, preact
# and the Netlify integration, none of which this site needs. Deployment is
# Cloudflare Pages.

imports:
  - path: github.com/HTMLTrust/htmltrust-hugo
