# ══════════════════════════════════════════════════════════════════════════════
# SITE PARAMETERS
#
# Every key here is read by a template in layouts/. There is no theme schema to
# satisfy, so anything unused has been removed rather than left commented out.
# ══════════════════════════════════════════════════════════════════════════════

# ──────────────────────────────────────────────────────────────────────────────
# IDENTITY — masthead, <title>, and the default meta description
# ──────────────────────────────────────────────────────────────────────────────
identity:
  name: "HTMLTrust"
  tagline: "Cryptographic authorship and a reader-controlled trust network for the open web"
  description: "HTMLTrust is a decentralized, standards-aligned framework for embedding cryptographic trust directly into HTML content. Authors sign blocks of HTML; browsers verify them locally; trust is a user-controlled, federated decision."

# ──────────────────────────────────────────────────────────────────────────────
# LOCALE — Go time layouts
# ──────────────────────────────────────────────────────────────────────────────
locale:
  date_format: "2 January 2006"

# ──────────────────────────────────────────────────────────────────────────────
# FOOTER
# ──────────────────────────────────────────────────────────────────────────────
footer:
  text: 'Written by <a href="https://www.jason-grey.com">Jason Grey</a>. Every repository is public on <a href="https://github.com/HTMLTrust">GitHub</a>, including <a href="https://github.com/HTMLTrust/htmltrust-website">this site</a>.'

copyright:
  # Deliberately links to the licence rather than naming one inline: the
  # repository LICENSE and the per-page signed `license` claims do not
  # currently agree, and the signed claim is the one a verifier reads.
  notice: '&#169; 2026 Jason Grey. Licence terms: <a href="https://github.com/HTMLTrust/htmltrust-website/blob/main/LICENSE">LICENSE</a>.'

# Trademark notice. The footer is the conventional place to assert a mark, and
# asserting it is what accrues common-law rights, so this does not wait on
# registration. Kept out of the masthead on purpose: a superscript mark in the
# wordmark fights the typography for no added legal effect.
trademark:
  notice: 'HTMLTrust&trade; is a trademark of Jason Grey. Implementing the specification needs no permission; using the name has one condition. See the <a href="/trademark/">trademark policy</a>.'

# ──────────────────────────────────────────────────────────────────────────────
# HTMLTRUST CONTENT SIGNING
# Site-level defaults consumed by github.com/HTMLTrust/htmltrust-hugo and the
# htmltrust-sign post-build tool. Individual pages opt in via front-matter
# `htmltrust.sign: true` and may add per-page `htmltrust.claims`.
# ──────────────────────────────────────────────────────────────────────────────
htmltrust:
  keyid: "did:web:jason-grey.com"
  algorithm: "ed25519"
